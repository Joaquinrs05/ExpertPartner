<div class="clock-card card">
  <div class="clock-header">
    <span class="clock-label text-label-sm">{{ 'dashboard.employee.clockWidget.status' | translate }}</span>
  </div>

  <p class="clock-date text-body-md">{{ currentTime() | date:'EEEE, MMMM d, yyyy' }}</p>

  <p class="clock-time">{{ currentTime() | date:'HH:mm:ss' }}</p>

  <div class="clock-status">
    <span class="status-dot" [class.status-dot--on]="isOnDuty()"></span>
    <span class="status-text text-body-md">
      {{ isOnDuty() ? ('dashboard.employee.clockWidget.onDuty' | translate) : ('dashboard.employee.clockWidget.offDuty' | translate) }}
    </span>
  </div>

  <button
    class="clock-btn"
    [class.clock-btn--on]="isOnDuty()"
    (click)="toggleClock()"
    type="button"
  >
    {{ isOnDuty() ? ('dashboard.employee.clockWidget.clockOut' | translate) : ('dashboard.employee.clockWidget.clockIn' | translate) }}
  </button>
</div>
