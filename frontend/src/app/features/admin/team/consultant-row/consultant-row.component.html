<tr class="consultant-row">
  <td class="col-consultant">
    <div class="consultant-info">
      <app-avatar
        [name]="consultant().fullName"
        [isOnline]="consultant().isOnline"
        [size]="40"
      />
      <div class="consultant-details">
        <span class="consultant-name">{{ consultant().fullName }}</span>
        <span class="consultant-id">{{ consultant().employeeId }}</span>
      </div>
    </div>
  </td>
  <td class="col-role">
    <div class="role-details">
      <span class="role-title">{{ consultant().role }}</span>
      <span class="role-level">{{ consultant().level }}</span>
    </div>
  </td>
  <td class="col-availability">
    <app-badge [type]="availabilityBadge()" />
  </td>
  <td class="col-eom">
    <app-badge [type]="eomBadge()" />
  </td>
  <td class="col-actions">
    <div class="action-buttons">
      <button class="action-btn" title="Edit consultant" aria-label="Edit consultant">
        ✏
      </button>
      <button class="action-btn" title="View consultant" aria-label="View consultant">
        👁
      </button>
    </div>
  </td>
</tr>
