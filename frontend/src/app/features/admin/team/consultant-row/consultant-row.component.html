<td class="col-consultant">
  <div class="consultant-info">
    <app-avatar
      [name]="consultant().fullName"
      [isOnline]="consultant().isOnline"
      [size]="40"
    />
    <div class="consultant-details">
      <span class="consultant-name">{{ consultant().fullName }}</span>
      <span class="consultant-id">{{ consultant().employeeId || '—' }}</span>
    </div>
  </div>
</td>
<td class="col-role">
  <span class="role-title">{{ consultant().role }}</span>
</td>
<td class="col-availability">
  <app-badge [type]="availabilityBadge()" />
</td>
<td class="col-project">
  {{ consultant().currentProject || '—' }}
</td>
<td class="col-actions">
  <div class="action-buttons">
    <button class="action-btn" title="Edit" aria-label="Edit consultant" (click)="edit.emit(consultant())">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    </button>
    <button class="action-btn" title="View" aria-label="View consultant">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>
</td>
