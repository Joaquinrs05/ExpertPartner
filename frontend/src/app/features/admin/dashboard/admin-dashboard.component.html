<div class="dashboard">
  <h1 class="text-h1 dashboard__heading">{{ 'dashboard.admin.title' | translate }}</h1>

  <div class="dashboard__kpi-row">
    <app-kpi-card
      [title]="'dashboard.admin.kpi.activeConsultants' | translate"
      value="128"
      badgeType="total"
    />
    <app-kpi-card
      [title]="'dashboard.admin.kpi.teamUtilization' | translate"
      value="42 / 128 online"
      badgeType="live"
    />
  </div>

  <div class="dashboard__actions">
    <button class="btn-primary" type="button">+ {{ 'team.addConsultant' | translate }}</button>
    <button class="btn-secondary" type="button" routerLink="/admin/emails">≡ {{ 'nav.emails' | translate }}</button>
  </div>

  <div class="dashboard__main">
    <div class="dashboard__activity">
      <app-activity-monitor />
    </div>
    <div class="dashboard__inbox">
      <app-express-inbox />
    </div>
  </div>
</div>
