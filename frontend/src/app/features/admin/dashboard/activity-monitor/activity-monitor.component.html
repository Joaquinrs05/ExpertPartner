<div class="card activity-monitor">
  <h3 class="text-h3 activity-monitor__title">{{ 'dashboard.admin.activityMonitor.title' | translate }}</h3>
  <div class="activity-monitor__table-wrap">
    <table class="activity-monitor__table">
      <thead>
        <tr>
          <th class="text-label-sm">Employee</th>
          <th class="text-label-sm">Action</th>
          <th class="text-label-sm">Timestamp</th>
        </tr>
      </thead>
      <tbody>
        @for (entry of activity$ | async; track entry.employee + entry.timestamp) {
          <tr class="activity-monitor__row">
            <td class="text-body-md">{{ entry.employee }}</td>
            <td><app-badge [type]="entry.action" /></td>
            <td class="text-body-md activity-monitor__time">{{ entry.timestamp | timeAgo }}</td>
          </tr>
        } @empty {
          <tr>
            <td colspan="3" class="activity-monitor__empty text-body-md">No recent activity</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
  <a href="#" class="activity-monitor__link text-body-md">View All Activity →</a>
</div>
