<header class="topbar" role="banner">
  <button
    class="topbar__icon-btn hamburger"
    type="button"
    aria-label="Toggle sidebar"
    (click)="onSidebarToggle()"
  >
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="3" y1="6" x2="21" y2="6" />
      <line x1="3" y1="12" x2="21" y2="12" />
      <line x1="3" y1="18" x2="21" y2="18" />
    </svg>
  </button>

  <div class="topbar__search">
    <input type="search" placeholder="Search..." aria-label="Search" />
  </div>

  <div class="topbar__actions">
    <button class="topbar__icon-btn" type="button" aria-label="Notifications">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
      </svg>
    </button>

    <!-- Avatar + dropdown -->
    <div class="avatar-menu">
      <button
        class="topbar__avatar"
        type="button"
        [attr.aria-label]="user()?.name + ' menu'"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        {{ initials() }}
      </button>

      @if (menuOpen()) {
        <div class="avatar-backdrop" (click)="closeMenu()"></div>
        <div class="dropdown" role="menu">
          @if (role() === 'employee') {
            <a class="dropdown__item" routerLink="/employee/profile" (click)="closeMenu()" role="menuitem">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="8" r="4" />
                <path d="M4 20v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2" />
              </svg>
              Profile
            </a>
          }
          <button class="dropdown__item dropdown__item--danger" type="button" (click)="logout()" role="menuitem">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16,17 21,12 16,7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            Cerrar sesión
          </button>
        </div>
      }
    </div>
  </div>
</header>
