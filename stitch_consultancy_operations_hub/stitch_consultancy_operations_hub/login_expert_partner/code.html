<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Consultancy Management Portal - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#93000a",
                        "surface-container": "#eceef0",
                        "tertiary": "#000000",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed-dim": "#4edea3",
                        "outline-variant": "#c6c6cd",
                        "surface-dim": "#d8dadc",
                        "error-container": "#ffdad6",
                        "secondary-container": "#d0e1fb",
                        "on-secondary-fixed-variant": "#38485d",
                        "surface-variant": "#e0e3e5",
                        "on-background": "#191c1e",
                        "primary-container": "#131b2e",
                        "surface": "#f7f9fb",
                        "on-tertiary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#3f465c",
                        "inverse-surface": "#2d3133",
                        "on-secondary-container": "#54647a",
                        "on-primary-container": "#7c839b",
                        "on-tertiary-fixed": "#002113",
                        "surface-container-low": "#f2f4f6",
                        "on-tertiary-container": "#009668",
                        "primary-fixed-dim": "#bec6e0",
                        "inverse-on-surface": "#eff1f3",
                        "tertiary-container": "#002113",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#6ffbbe",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#e6e8ea",
                        "on-surface": "#191c1e",
                        "secondary-fixed-dim": "#b7c8e1",
                        "primary-fixed": "#dae2fd",
                        "primary": "#000000",
                        "surface-tint": "#565e74",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#d3e4fe",
                        "surface-container-highest": "#e0e3e5",
                        "on-surface-variant": "#45464d",
                        "background": "#f7f9fb",
                        "secondary": "#505f76",
                        "on-secondary-fixed": "#0b1c30",
                        "surface-bright": "#f7f9fb",
                        "on-primary-fixed": "#131b2e",
                        "on-tertiary-fixed-variant": "#005236",
                        "inverse-primary": "#bec6e0",
                        "outline": "#76777d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "lg": "24px",
                        "xl": "40px",
                        "base": "4px",
                        "sm": "8px",
                        "md": "16px",
                        "container-max": "1440px",
                        "sidebar-width": "260px",
                        "xs": "4px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "table-header": ["Inter"],
                        "label-sm": ["Inter"],
                        "h2": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "h3": ["Inter"],
                        "h1": ["Inter"]
                    },
                    "fontSize": {
                        "table-header": ["13px", {"lineHeight": "1.4", "fontWeight": "500"}],
                        "label-sm": ["12px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "h2": ["24px", {"lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "body-lg": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "body-md": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "h3": ["20px", {"lineHeight": "1.4", "fontWeight": "600"}],
                        "h1": ["36px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}]

                }
            }
        }
    </script>
<style>
        .elevation-level-2 {
            box-shadow: 0px 4px 12px rgba(15, 23, 42, 0.08);
        }
    </style>
</head>
<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-md antialiased relative overflow-hidden">
<!-- Subtle geometric background decoration -->
<div class="absolute inset-0 z-0 pointer-events-none overflow-hidden flex items-center justify-center opacity-30">
<div class="w-[800px] h-[800px] rounded-full border-[1px] border-outline-variant absolute top-[-200px] left-[-200px]"></div>
<div class="w-[600px] h-[600px] rounded-full border-[1px] border-outline-variant absolute bottom-[-100px] right-[-100px]"></div>
</div>
<!-- Login Card Container -->
<div class="w-full max-w-[420px] bg-surface-container-lowest rounded-xl border border-surface-variant elevation-level-2 p-lg sm:p-xl relative z-10">
<!-- Header / Logo Area -->
<div class="flex flex-col items-center mb-xl">
<div class="w-16 h-16 bg-primary-container rounded-lg flex items-center justify-center mb-md">
<span class="material-symbols-outlined text-on-primary-container" style="font-size: 32px; font-variation-settings: 'FILL' 1;">
                    partner_exchange
                </span>
</div>
<h1 class="font-h2 text-h2 text-on-surface text-center">Expert Partner</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-xs">Management Suite Access</p>
</div>
<!-- Login Form -->
<form action="#" class="flex flex-col gap-md" method="POST">
<!-- Email Field -->
<div class="flex flex-col gap-base">
<label class="font-label-sm text-label-sm text-on-surface uppercase" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">mail</span>
</div>
<input class="w-full pl-[36px] pr-sm py-sm bg-surface-container-lowest border border-outline-variant rounded font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="email" name="email" placeholder="name@consultancy.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-base">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface uppercase" for="password">Password</label>
<a class="font-body-md text-body-md text-secondary hover:text-primary transition-colors text-sm" href="#">Forgot password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">lock</span>
</div>
<input class="w-full pl-[36px] pr-sm py-sm bg-surface-container-lowest border border-outline-variant rounded font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full mt-sm bg-primary text-on-primary py-[10px] px-md rounded-lg font-label-sm text-label-sm flex items-center justify-center gap-sm hover:bg-inverse-surface transition-colors uppercase tracking-wider" type="submit">
                Log In
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Footer Info -->
<div class="mt-lg pt-md border-t border-surface-variant text-center">
<p class="font-body-md text-body-md text-outline text-xs">
                Secure access for authorized personnel only. <br/> Need assistance? <a class="text-secondary hover:text-primary transition-colors" href="#">Contact IT Support</a>.
            </p>
</div>
</div>
</body></html>
